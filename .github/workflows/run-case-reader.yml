name: Run the Case Reader

# Started by hand from the Actions tab. Reads the test files with Meta's models,
# scores the result against the answer key, and saves everything on the
# `results` branch. The API key comes from the repository secret META_API_KEY.

on:
  workflow_dispatch:
    inputs:
      cases:
        description: "Test files to read, comma-separated (empty = all), e.g. case-01,case-03"
        required: false
        default: ""
      effort:
        description: "Muse Spark reasoning effort"
        required: true
        default: "high"
        type: choice
        options: [low, medium, high, xhigh]
      sweep:
        description: "Try several SAM 3.1 phrasings for each mark type"
        required: false
        default: false
        type: boolean
      min_confidence:
        description: "Drop SAM 3.1 boxes below this confidence (0 to 1)"
        required: false
        default: "0.3"

permissions:
  contents: write

concurrency:
  group: case-reader-run
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUN_NAME: run-${{ github.run_number }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check the Meta Model API key
        env:
          MODEL_API_KEY: ${{ secrets.META_API_KEY }}
        run: python -m case_reader check-key

      - name: Read the test files with Muse Spark and SAM 3.1
        env:
          MODEL_API_KEY: ${{ secrets.META_API_KEY }}
          CASES: ${{ inputs.cases }}
          EFFORT: ${{ inputs.effort }}
          SWEEP: ${{ inputs.sweep }}
          MIN_CONFIDENCE: ${{ inputs.min_confidence }}
        run: |
          set +e -uo pipefail
          args=(read-all --out "runs/$RUN_NAME" --effort "$EFFORT" --min-confidence "$MIN_CONFIDENCE")
          if [ -n "$CASES" ]; then args+=(--cases "$CASES"); fi
          if [ "$SWEEP" = "true" ]; then args+=(--sweep); fi
          python -m case_reader "${args[@]}" 2>&1 | tee "runs-$RUN_NAME.log"
          echo "READ_STATUS=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      - name: Score against the answer key
        if: always()
        run: |
          if [ -d "runs/$RUN_NAME" ]; then
            python tools/score.py "runs/$RUN_NAME" | tee -a "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Save the results on the results branch
        if: always()
        env:
          EFFORT: ${{ inputs.effort }}
          SWEEP: ${{ inputs.sweep }}
        run: |
          set -euo pipefail
          [ -d "runs/$RUN_NAME" ] || { echo "No results to save."; exit 0; }
          mv "runs-$RUN_NAME.log" "runs/$RUN_NAME/log.txt" || true
          # The page images are the test files rendered again; leave them out to keep the branch small.
          find "runs/$RUN_NAME" -type d -name pages -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin results >/dev/null; then
            git fetch --depth=1 origin results
            git worktree add ../results-branch FETCH_HEAD
            git -C ../results-branch checkout -B results
          else
            git worktree add --detach ../results-branch
            git -C ../results-branch checkout --orphan results
            git -C ../results-branch rm -rf -q .
          fi
          mkdir -p ../results-branch/runs
          cp -r "runs/$RUN_NAME" ../results-branch/runs/
          cd ../results-branch
          git add runs
          git commit -q -m "Case Reader $RUN_NAME (effort $EFFORT, sweep $SWEEP, reader exit ${READ_STATUS:-?})"
          git push -q origin results
          echo "Saved to the results branch: runs/$RUN_NAME" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if a case could not be read
        if: env.READ_STATUS != '0'
        run: exit 1
